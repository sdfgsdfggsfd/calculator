<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="logo.png" type="image/png">
<title>Surebet Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }

  /* ── Tokens ─────────────────────────────────────────── */
  :root {
    --bg:      #0c0e0c;
    --panel:   #131612;
    --panel-2: #191d18;
    --rule:    #2a2f29;
    --rule-2:  #1e231d;
    --ink:     #ece9de;
    --ink-2:   #9ba292;
    --ink-3:   #6a7265;
    --profit:  #7fe0a6;
    --loss:    #ff7b68;
    --fix:     #f2b45c;
    --poly:    #b3a5ff;
    --lay:     #6cb8ff;
    --sans: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg:      #f1efe6;
    --panel:   #fbfaf5;
    --panel-2: #ebe9df;
    --rule:    #d2cfc1;
    --rule-2:  #e3e0d4;
    --ink:     #1a1d18;
    --ink-2:   #566051;
    --ink-3:   #7e8575;
    --profit:  #13744a;
    --loss:    #bf3820;
    --fix:     #9a5f00;
    --poly:    #5a3fd0;
    --lay:     #1c63ab;
    color-scheme: light;
  }

  /* ── Base ───────────────────────────────────────────── */
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.45 var(--sans);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .page { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 16px 24px; }
  .muted { color: var(--ink-3); font-size: 12px; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .4; }
  :focus-visible { outline: 2px solid var(--fix); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ── Masthead: the locked profit is the hero ────────── */
  .masthead {
    display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end;
    padding-bottom: 22px; border-bottom: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand img { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
  .brand h1 { font: 800 30px/1 var(--sans); letter-spacing: -.025em; }
  .brand p { margin-top: 6px; color: var(--ink-2); font-size: 14px; max-width: 42ch; }

  .hero-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .status {
    font: 600 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--rule); color: var(--ink-2);
  }
  .status[data-state="arb"]  { color: var(--profit); border-color: color-mix(in oklab, var(--profit) 45%, transparent); }
  .status[data-state="none"] { color: var(--loss);   border-color: color-mix(in oklab, var(--loss) 45%, transparent); }

  .hero { display: flex; align-items: stretch; }
  .stat { padding: 0 24px; border-left: 1px solid var(--rule); }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat:last-child { padding-right: 0; }
  .stat dt { font: 500 13px/1 var(--sans); color: var(--ink-3); }
  .stat dd { margin-top: 10px; font: 600 26px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat.roi dd { font-size: 44px; letter-spacing: -.03em; }
  .stat small { display: block; margin-top: 6px; font: 400 12px/1 var(--mono); color: var(--ink-3); }
  .hero[data-state="arb"] .roi dd { color: var(--profit); }

  /* ── Toolbar ────────────────────────────────────────── */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--rule);
  }
  .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font: 500 13px var(--sans); color: var(--ink-2); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0; border-left: 1px solid var(--rule);
    padding: 7px 13px; font: 500 13px var(--mono); color: var(--ink-2);
  }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .input {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    padding: 7px 10px; font: 500 13px var(--mono); color: var(--ink);
    min-width: 0; transition: border-color .12s;
  }
  .input:hover { border-color: var(--ink-3); }
  .input:focus { outline: none; border-color: var(--fix); }
  .input:focus-visible { outline: 2px solid var(--fix); outline-offset: 1px; }
  .input.num-in { text-align: right; }
  .w-sm { width: 84px; }
  .w-md { width: 112px; }
  .w-odds { width: 96px; text-align: center; }
  .w-stake { width: 128px; text-align: right; }
  select.input { font-family: var(--sans); font-size: 13px; padding-right: 8px; }

  .btn {
    background: transparent; border: 1px solid var(--rule); border-radius: 8px;
    padding: 9px 14px; font: 600 13px/1 var(--sans); color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn[aria-pressed="true"] { border-color: var(--ink); background: var(--panel-2); }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .btn.solid:hover { opacity: .88; }
  .link {
    background: none; border: 0; padding: 0; color: var(--fix);
    font: 600 12px var(--sans); text-decoration: underline; text-underline-offset: 3px;
  }

  .warn {
    margin-top: 12px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid color-mix(in oklab, var(--fix) 45%, transparent);
    color: var(--fix); font-size: 13px;
  }

  /* ── Ledger table ───────────────────────────────────── */
  .grid-wrap {
    margin-top: 18px; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 12px; overflow-x: auto;
  }
  table { width: 100%; min-width: 980px; border-collapse: collapse; }
  th {
    text-align: left; padding: 13px 10px; font: 500 13px/1.2 var(--sans); color: var(--ink-3);
    border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  th.poly { color: var(--poly); }
  td { padding: 10px; border-bottom: 1px solid var(--rule-2); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in oklab, var(--ink) 2.5%, transparent); }
  tr.is-lay > td:first-child { box-shadow: inset 3px 0 0 var(--lay); }
  .c   { text-align: center; }
  .r   { text-align: right; }
  .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .poly-col { color: var(--poly); }
  .idx { font: 500 12px var(--mono); color: var(--ink-3); }

  .side {
    width: 66px; padding: 7px 0; border-radius: 6px; background: transparent;
    font: 700 12px/1 var(--sans); border: 1px solid var(--rule);
  }
  .side.back { color: var(--profit); border-color: color-mix(in oklab, var(--profit) 40%, transparent); }
  .side.lay  { color: var(--lay);    border-color: color-mix(in oklab, var(--lay) 45%, transparent); }
  .side:hover { background: var(--panel-2); }

  .cur {
    padding: 6px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--rule);
    font: 600 12px/1 var(--mono); color: var(--ink-2); min-width: 74px;
  }
  .cur:hover { color: var(--ink); border-color: var(--ink-3); }

  .lock {
    padding: 6px 9px; border-radius: 6px; background: transparent; border: 1px solid var(--rule);
    font: 600 12px/1 var(--sans); color: var(--ink-2); min-width: 62px;
  }
  .lock:hover { border-color: var(--fix); color: var(--fix); }
  .lock[aria-pressed="true"] { background: color-mix(in oklab, var(--fix) 14%, transparent); border-color: var(--fix); color: var(--fix); }

  .stake-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .stake-in.locked { border-color: var(--fix); color: var(--fix); }
  .hint { font: 400 11px/1.3 var(--mono); color: var(--ink-3); white-space: nowrap; }
  .hint.lay { color: var(--lay); }
  .pos { color: var(--profit); font-weight: 600; }
  .neg { color: var(--loss);   font-weight: 600; }

  tfoot td { background: var(--panel-2); border-top: 1px solid var(--rule); border-bottom: 0; padding: 12px 10px; }
  tfoot .lab { font: 500 13px var(--sans); color: var(--ink-2); }

  /* ── Actions & footer ───────────────────────────────── */
  .actions {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    gap: 12px; margin-top: 18px;
  }
  .actions .group { display: flex; gap: 10px; flex-wrap: wrap; }
  .foot {
    border-top: 1px solid var(--rule); padding: 16px; text-align: center;
    color: var(--ink-3); font-size: 12px;
  }
  .foot a { color: var(--ink-2); text-decoration: none; font-weight: 600; }
  .foot a:hover { color: var(--ink); }

  /* ── Small screens: ledger rows become cards ────────── */
  @media (max-width: 860px) {
    .masthead { grid-template-columns: 1fr; gap: 18px; }
    .hero-wrap { align-items: stretch; }
    .hero { justify-content: space-between; }
    .stat { padding: 0 14px; }
    .stat:first-child { padding-left: 0; }
    .stat:last-child { padding-right: 0; }
    .stat dd { font-size: 19px; }
    .stat.roi dd { font-size: 30px; }
    .toolbar { gap: 12px 16px; }

    .grid-wrap { overflow: visible; background: none; border: 0; }
    table, tbody, tfoot { display: block; min-width: 0; }
    thead { display: none; }
    tbody tr {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px;
      background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; position: relative;
    }
    tbody tr:hover td { background: none; }
    tr.is-lay { border-left: 3px solid var(--lay); }
    tr.is-lay > td:first-child { box-shadow: none; }
    td {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 0; border: 0; text-align: left !important; min-width: 0;
    }
    td::before {
      content: attr(data-label); font: 500 12px var(--sans); color: var(--ink-3);
    }
    td.idx-cell { position: absolute; top: 12px; right: 14px; flex-direction: row; }
    td.idx-cell::before { content: none; }
    td.span2 { grid-column: 1 / -1; }
    td input.input, td select.input { width: 100%; }
    td .hint { white-space: normal; }
    .stake-cell { align-items: stretch; width: 100%; }
    .stake-cell .w-stake { width: 100%; text-align: right; }
    .stake-cell .hint { text-align: right; }

    tfoot tr {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--panel-2); border: 1px solid var(--rule); border-radius: 12px; padding: 14px;
    }
    tfoot td { display: block; background: none; border: 0; padding: 0; }
    tfoot td:empty { display: none; }
    tfoot td[colspan] { width: 100%; }
  }
  @media (max-width: 560px) {
    .masthead { padding-bottom: 16px; }
    .brand h1 { font-size: 24px; }
    .brand p { font-size: 13px; }
    .stat dd { font-size: 17px; }
    .stat.roi dd { font-size: 26px; }
    .stat dt { font-size: 12px; }
    .stat small { font-size: 11px; }
    .stat { padding: 0 10px; }
    .toolbar .field { width: 100%; }
    .toolbar .field > .btn { width: 100%; }
    .w-md { width: 100%; }
    .actions .group { width: 100%; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="brand">
      <img src="logo.png" alt="" width="44" height="44">
      <div>
        <h1>Surebet calculator</h1>
        <p>Stakes that lock the same profit whichever outcome lands.</p>
      </div>
    </div>

    <div class="hero-wrap">
      <div class="status" id="status" data-state="idle" role="status" aria-live="polite">Enter odds to start</div>
      <dl class="hero" id="hero">
        <div class="stat roi"><dt>ROI</dt><dd id="roi">—</dd></div>
        <div class="stat"><dt>Guaranteed profit</dt><dd id="profit">—</dd><small id="profit-sub"></small></div>
        <div class="stat"><dt>Total stake</dt><dd id="total">—</dd></div>
      </dl>
    </div>
  </header>

  <section class="toolbar" aria-label="Market settings">
    <div class="field">
      <span class="lbl" id="outs-lbl">Outcomes</span>
      <div class="seg" id="outs" role="group" aria-labelledby="outs-lbl"></div>
    </div>
    <div class="field">
      <label class="lbl" for="fork">Market</label>
      <select class="input" id="fork" data-key="fork"></select>
    </div>
    <div class="field">
      <button class="btn" id="comm" type="button" data-act="comm" aria-pressed="false">Commissions</button>
    </div>
    <div class="field">
      <label class="lbl" for="rate">BRL per USD</label>
      <input class="input w-md" id="rate" data-key="rate" data-in="rate" type="text" inputmode="decimal" placeholder="loading…" autocomplete="off">
      <span class="muted" id="rate-src"></span>
      <button class="link" id="rate-live" data-act="rate-live" type="button" hidden>Use live rate</button>
    </div>
  </section>

  <p class="warn" id="warn" hidden></p>

  <div class="grid-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

  <div class="actions">
    <div class="group">
      <button class="btn" type="button" data-act="reset">Reset</button>
    </div>
    <div class="group">
      <button class="btn" id="theme" type="button" data-act="theme">Light theme</button>
      <button class="btn solid" id="share" type="button" data-act="share">Share odds</button>
    </div>
  </div>

</div>

<footer class="foot">© 2026 · built by <a href="https://x.com/juronegativo" target="_blank" rel="noopener">nagato</a></footer>

<script>
// ═══════════════════════════════════════════════════════
//  POLYMARKET TAKER FEES
//  Source: docs.polymarket.com/trading/fees
//  fee = C × feeRate × p × (1 − p)   (C = shares, p = price)
//  Per the Market Details schedule the exponent is 1.
//  Makers pay no fee. Geopolitics markets are fee-free.
// ═══════════════════════════════════════════════════════
const POLY = {
  "Crypto":          0.07,
  "Sports":          0.05,
  "Economics":       0.05,
  "Culture":         0.05,
  "Weather":         0.05,
  "Other / General": 0.05,
  "Finance":         0.04,
  "Politics":        0.04,
  "Mentions":        0.04,
  "Tech":            0.04,
  "Geopolitics":     0,
};
const CATS = Object.keys(POLY);

const FORKS = {
  2: [
    { id: "1-2",  label: "1 — 2" },
    { id: "1-X2", label: "1 — X2" },
    { id: "1X-2", label: "1X — 2" },
    { id: "AH",   label: "AH1 — AH2" },
    { id: "OU",   label: "Over — Under" },
  ],
  3: [
    { id: "1-X-2",  label: "1 — X — 2" },
    { id: "3corr",  label: "3 corners" },
    { id: "DNB+D",  label: "DNB + Draw" },
  ],
  N: [{ id: "multi", label: "Multi-way" }],
};
const forksFor = n => n === 2 ? FORKS[2] : n === 3 ? FORKS[3] : FORKS.N;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const S = {
  n: 2,
  fork: "1-2",
  showComm: false,
  rows: [],
  nextId: 1,
  total: null,      // USD total stake override (null = 100)
  totalRaw: "",     // what the user typed in the total box
  customRate: null, // user-typed BRL per USD (overrides live)
  rateRaw: "",
  liveRate: null,
  liveSrc: "",
};

function mk(id, odds = "2") {
  return { id, odds, comm: "0", bt: "back", poly: false, cat: "Sports",
           cur: "USD", fixed: false, fixedVal: "", manual: null };
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
const num   = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
const clean = v => String(v ?? "").replace(/[^0-9.,]/g, "").slice(0, 12);
const esc   = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => (v < -0.005 ? "−" : "") + Math.abs(v).toFixed(2);
const signed = (v, s) => (v < -0.005 ? "−" : "+") + s + Math.abs(v).toFixed(2);
const sym   = c => c === "BRL" ? "R$" : "$";
const rate  = () => S.customRate ?? S.liveRate;

// Convert a USD amount into the display currency (null if no rate for BRL)
const toDisp = (usd, cur) => cur === "BRL" ? (rate() ? usd * rate() : null) : usd;
// Convert a display amount into USD (BRL without a rate is taken as-is)
const toUsd  = (v, cur)   => cur === "BRL" ? (rate() ? v / rate() : v) : v;

function convertStr(str, from, to) {
  const v = num(str);
  if (!Number.isFinite(v)) return str;
  const d = toDisp(toUsd(v, from), to);
  return d === null ? str : d.toFixed(2);
}

// ═══════════════════════════════════════════════════════
//  MATH
// ═══════════════════════════════════════════════════════
/**
 * Each row is one outcome. Per unit of stake, a row's P&L is:
 *
 *   Back @ raw odds, commission c on winnings:
 *     own outcome   → net − 1          (net = 1 + (eff − 1)(1 − c))
 *     other outcome → −1
 *     eff = 1 / (p(1 + f(1 − p)))      where p = 1/raw, f = Polymarket feeRate
 *
 *   Lay @ raw odds L, commission c on winnings:
 *     own outcome   → −(L − 1)         (liability)
 *     other outcome → 1 − c            (net winnings)
 *
 * Stakes are solved so that P&L is equal on every outcome:
 *   A·x = G·1  plus one normalisation (total stake, or a locked stake).
 */
function legOf(r) {
  const raw = num(r.odds);
  if (!(raw > 1)) return null;
  const c = (num(r.comm) || 0) / 100;

  if (r.bt === "lay") {
    return { lay: true, raw, c, own: -(raw - 1), other: 1 - c, net: null, cost: 1 / raw, price: 1 / raw };
  }

  const price = 1 / raw;
  const fee   = r.poly ? (POLY[r.cat] ?? 0) : 0;
  const cost  = price * (1 + fee * (1 - price));  // cash per $1 payout, incl. taker fee
  const eff   = 1 / cost;
  const net   = 1 + (eff - 1) * (1 - c);
  if (!(net > 1)) return null;
  return { lay: false, raw, c, own: net - 1, other: -1, net, cost, price, fee };
}

function solveLinear(M, N) {
  // Gauss-Jordan with partial pivoting. M is N rows × (N+1) cols; last col is RHS.
  for (let c = 0; c < N; c++) {
    let p = c;
    for (let r = c + 1; r < N; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c];
    for (let k = c; k <= N; k++) M[c][k] /= d;
    for (let r = 0; r < N; r++) {
      if (r === c || M[r][c] === 0) continue;
      const f = M[r][c];
      for (let k = c; k <= N; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map(r => r[N]);
}

function model() {
  const n = S.rows.length;
  const legs = S.rows.map(legOf);
  if (legs.some(l => !l)) return { ok: false, legs, reason: "odds" };

  // A[m][i] = P&L per unit stake of row i when outcome m happens
  const A = Array.from({ length: n }, (_, m) => legs.map((l, i) => m === i ? l.own : l.other));

  const fixIdx = S.rows.findIndex(r => r.fixed);
  const N = n + 1;                       // unknowns: x_0..x_{n-1}, G
  const M = Array.from({ length: N }, () => Array(N + 1).fill(0));
  for (let m = 0; m < n; m++) {
    for (let i = 0; i < n; i++) M[m][i] = A[m][i];
    M[m][n] = -1;
  }
  if (fixIdx >= 0) {
    const f = toUsd(num(S.rows[fixIdx].fixedVal), S.rows[fixIdx].cur);
    if (!(f > 0)) return { ok: false, legs, reason: "lock" };
    M[n][fixIdx] = 1;
    M[n][N] = f;
  } else {
    for (let i = 0; i < n; i++) M[n][i] = 1;
    M[n][N] = S.total ?? 100;
  }

  const z = solveLinear(M, N);
  if (!z) return { ok: false, legs, reason: "singular" };
  const x = z.slice(0, n);

  // Manually typed stakes override the solved value for that row
  S.rows.forEach((r, i) => {
    if (i === fixIdx || r.manual === null) return;
    const v = toUsd(num(r.manual), r.cur);
    if (Number.isFinite(v)) x[i] = v;
  });

  const pnl   = A.map(row => row.reduce((s, a, i) => s + a * x[i], 0));
  const total = x.reduce((a, b) => a + b, 0);
  const minP  = Math.min(...pnl);
  const valid = x.every(v => v >= -1e-9);
  return {
    ok: true, legs, A, x, pnl, total, minP, valid,
    roi: total > 0 ? (minP / total) * 100 : 0,
    surebet: valid && minP > 0.005,
  };
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render() {
  const ae = document.activeElement;
  const key = ae && ae.dataset ? ae.dataset.key : null;
  const caret = key && typeof ae.selectionStart === "number" ? ae.selectionStart : null;

  const md = model();
  drawControls();
  drawTable(md);
  drawHero(md);
  drawWarn();

  if (key) {
    const el = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      if (caret !== null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (_) {} }
    }
  }
}

function drawControls() {
  const outs = document.getElementById("outs");
  outs.innerHTML = [2, 3, 4, 5, 6].map(n =>
    `<button type="button" data-act="n" data-n="${n}" aria-pressed="${n === S.n}" aria-label="${n} outcomes">${n}</button>`
  ).join("");

  const fk = document.getElementById("fork");
  const opts = forksFor(S.n);
  const sig = opts.map(o => o.id).join("|");
  if (fk.dataset.sig !== sig) {
    fk.innerHTML = opts.map(o => `<option value="${o.id}">${o.label}</option>`).join("");
    fk.dataset.sig = sig;
  }
  fk.value = S.fork;

  const cb = document.getElementById("comm");
  cb.setAttribute("aria-pressed", String(S.showComm));
  cb.textContent = S.showComm ? "Hide commissions" : "Show commissions";

  const rin = document.getElementById("rate");
  if (document.activeElement !== rin) rin.value = S.rateRaw;
  rin.placeholder = S.liveRate ? S.liveRate.toFixed(4) : "loading…";

  document.getElementById("rate-src").textContent =
    S.customRate !== null ? "custom rate"
    : S.liveRate ? `live · ${S.liveSrc}`
    : S.liveSrc === "unavailable" ? "live rate unavailable, type one"
    : "";
  document.getElementById("rate-live").hidden = S.customRate === null;

  document.getElementById("theme").textContent =
    document.documentElement.dataset.theme === "light" ? "Dark theme" : "Light theme";
}

function drawTable(md) {
  const thead = document.getElementById("thead");
  const tbody = document.getElementById("tbody");
  const tfoot = document.getElementById("tfoot");

  let head = `<tr>
    <th class="c" scope="col">#</th>
    <th class="c" scope="col">Side</th>
    <th scope="col">Odds</th>
    <th class="r" scope="col">Implied</th>`;
  if (S.showComm) head += `<th class="r" scope="col">Comm %</th><th class="r" scope="col">Net odds</th>`;
  head += `
    <th class="c poly" scope="col">Polymarket fee</th>
    <th class="poly" scope="col">Category</th>
    <th class="r poly" scope="col">Taker fee</th>
    <th class="c" scope="col">Currency</th>
    <th class="r" scope="col">Stake</th>
    <th class="c" scope="col">Lock</th>
    <th class="r" scope="col">Profit if it hits</th>
  </tr>`;
  thead.innerHTML = head;

  tbody.innerHTML = S.rows.map((r, i) => {
    const lay  = r.bt === "lay";
    const raw  = num(r.odds);
    const leg  = md.legs[i];
    const cur  = r.cur;
    const sUsd = md.ok ? md.x[i] : null;

    let stakeText;
    if (r.manual !== null) stakeText = r.manual;
    else if (r.fixed)      stakeText = r.fixedVal;
    else {
      const d = sUsd === null ? null : toDisp(sUsd, cur);
      stakeText = d === null ? "" : d.toFixed(2);
    }

    const prob = raw > 1 ? (100 / raw).toFixed(1) + "%" : "—";

    // Profit if this row's outcome hits
    const own = md.ok ? md.pnl[i] : null;
    const ownDisp = own === null ? null : toDisp(own, cur);
    let profitHtml = `<span class="muted">—</span>`;
    if (ownDisp !== null) {
      const alt = cur === "USD"
        ? (rate() ? `≈ R$${(own * rate()).toFixed(2)}` : "")
        : `≈ $${own.toFixed(2)}`;
      profitHtml = `<span class="${own >= -0.005 ? "pos" : "neg"}">${signed(ownDisp, sym(cur))}</span>`
                 + (alt ? `<span class="hint" style="display:block">${alt}</span>` : "");
    }

    // Hints under the stake
    const hints = [];
    if (lay && sUsd !== null && sUsd >= 0) {
      const liab = toDisp(sUsd * (raw - 1), cur);
      if (liab !== null) hints.push(`<span class="hint lay">Liab ${sym(cur)}${liab.toFixed(2)}</span>`);
    }
    if (!lay && r.poly && leg && sUsd !== null) {
      hints.push(`<span class="hint">${(sUsd / leg.cost).toFixed(2)} shares</span>`);
    }
    if (sUsd !== null) {
      if (cur === "USD" && rate()) hints.push(`<span class="hint">≈ R$${(sUsd * rate()).toFixed(2)}</span>`);
      if (cur === "BRL")           hints.push(`<span class="hint">≈ $${sUsd.toFixed(2)}</span>`);
    }

    // Taker fee as % of cash spent (docs: f × (1 − p))
    let feeTxt = `<span class="muted">—</span>`;
    if (!lay && r.poly && raw > 1) {
      const f = POLY[r.cat] ?? 0;
      feeTxt = `${(f * (1 - 1 / raw) * 100).toFixed(2)}%`;
    }

    const commCols = S.showComm ? `
      <td class="num" data-label="Comm %">
        <input class="input w-sm num-in" type="text" inputmode="decimal" data-in="comm" data-id="${r.id}"
          data-key="comm${r.id}" value="${esc(r.comm)}" aria-label="Commission %, outcome ${i + 1}">
      </td>
      <td class="num" data-label="Net odds">${!lay && leg ? leg.net.toFixed(3) : `<span class="muted">—</span>`}</td>` : "";

    return `
    <tr class="${lay ? "is-lay" : ""}">
      <td class="c idx idx-cell" data-label="#">${i + 1}</td>
      <td class="c" data-label="Side">
        <button class="side ${lay ? "lay" : "back"}" type="button" data-act="side" data-id="${r.id}"
          aria-label="Outcome ${i + 1}: ${lay ? "lay" : "back"}. Switch side.">${lay ? "Lay" : "Back"}</button>
      </td>
      <td data-label="Odds">
        <input class="input w-odds" type="text" inputmode="decimal" data-in="odds" data-id="${r.id}"
          data-key="odds${r.id}" value="${esc(r.odds)}" placeholder="${lay ? "Lay odds" : "Odds"}"
          aria-label="Outcome ${i + 1} odds">
      </td>
      <td class="num" data-label="Implied">${prob}</td>
      ${commCols}
      <td class="c poly" data-label="Polymarket">
        ${lay ? `<span class="muted">back only</span>`
              : `<input type="checkbox" data-act="poly" data-id="${r.id}" ${r.poly ? "checked" : ""}
                   aria-label="Use Polymarket taker fee, outcome ${i + 1}" style="accent-color: var(--poly); width:16px; height:16px;">`}
      </td>
      <td class="poly" data-label="Category">
        <select class="input" data-act="cat" data-id="${r.id}" ${(!r.poly || lay) ? "disabled" : ""}
          aria-label="Polymarket category, outcome ${i + 1}">
          ${CATS.map(c => `<option value="${esc(c)}"${r.cat === c ? " selected" : ""}>${esc(c)}</option>`).join("")}
        </select>
      </td>
      <td class="num poly" data-label="Taker fee">${feeTxt}</td>
      <td class="c" data-label="Currency">
        <button class="cur" type="button" data-act="cur" data-id="${r.id}" aria-label="Currency, outcome ${i + 1}">${cur === "BRL" ? "R$ BRL" : "$ USD"}</button>
      </td>
      <td data-label="Stake">
        <div class="stake-cell">
          <input class="input w-stake stake-in ${r.fixed ? "locked" : ""}" type="text" inputmode="decimal"
            data-in="stake" data-id="${r.id}" data-key="stake${r.id}" value="${esc(stakeText)}"
            placeholder="${lay ? "Backer stake" : "Stake"}" aria-label="Outcome ${i + 1} stake, ${cur}">
          ${hints.join("")}
        </div>
      </td>
      <td class="c" data-label="Lock">
        <button class="lock" type="button" data-act="fix" data-id="${r.id}" aria-pressed="${r.fixed}"
          aria-label="Lock stake, outcome ${i + 1}">${r.fixed ? "Locked" : "Lock"}</button>
      </td>
      <td class="r" data-label="Profit if it hits">${profitHtml}</td>
    </tr>`;
  }).join("");

  // Footer: total stake + guaranteed (lowest) profit
  const before = 8 + (S.showComm ? 2 : 0);
  const totalVal = S.total !== null ? S.totalRaw : (md.ok ? md.total.toFixed(2) : "");
  let profitFoot = `<span class="muted">—</span>`;
  if (md.ok && md.valid) {
    const sub = rate() ? `<span class="hint" style="display:block">≈ R$${(md.minP * rate()).toFixed(2)}</span>` : "";
    profitFoot = `<span class="${md.minP >= -0.005 ? "pos" : "neg"}" title="Lowest profit across all outcomes">${signed(md.minP, "$")}</span>${sub}`;
  }
  tfoot.innerHTML = `
    <tr>
      <td colspan="${before}" class="r"><span class="lab">Total stake, USD</span></td>
      <td>
        <input class="input w-stake" type="text" inputmode="decimal" data-in="total" data-key="total"
          value="${esc(totalVal)}" placeholder="100" aria-label="Total stake in USD">
      </td>
      <td></td>
      <td class="r" title="Lowest profit across all outcomes">${profitFoot}</td>
    </tr>`;
}

function drawHero(md) {
  const st = document.getElementById("status");
  const hero = document.getElementById("hero");
  let state, text;

  if (md.reason === "odds") {
    state = "idle"; text = "Enter odds above 1.00 for every outcome";
  } else if (md.reason === "lock") {
    state = "idle"; text = "Locked stake is empty";
  } else if (md.reason) {
    state = "idle"; text = "No stake split for these odds";
  } else if (!md.valid) {
    state = "none"; text = "No valid split: one stake would be negative";
  } else if (md.surebet) {
    state = "arb";  text = "Surebet: the profit locks on every outcome";
  } else {
    state = "none"; text = "No arbitrage: at least one outcome loses";
  }
  st.dataset.state = state;
  st.textContent = text;
  hero.dataset.state = state;

  const ok = md.ok && md.valid;
  document.getElementById("roi").textContent =
    ok ? (md.roi >= 0 ? "+" : "−") + Math.abs(md.roi).toFixed(2) + "%" : "—";
  document.getElementById("profit").textContent = ok ? signed(md.minP, "$") : "—";
  document.getElementById("profit-sub").textContent =
    ok && rate() ? `≈ R$${(md.minP * rate()).toFixed(2)}` : "";
  document.getElementById("total").textContent = md.ok ? "$" + md.total.toFixed(2) : "—";
}

function drawWarn() {
  const w = document.getElementById("warn");
  const msgs = [];
  if (S.rows.some(r => r.cur === "BRL") && !rate()) {
    msgs.push("BRL rows need an exchange rate. Type one above, or wait for the live rate.");
  }
  w.hidden = msgs.length === 0;
  w.textContent = msgs.join(" ");
}

// ═══════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════
function setOutcomes(n) {
  S.n = n;
  while (S.rows.length < n) S.rows.push(mk(S.nextId++));
  S.rows = S.rows.slice(0, n);
  if (!forksFor(n).some(f => f.id === S.fork)) S.fork = forksFor(n)[0].id;
}

function onFork(v) {
  S.fork = v;
  S.rows.forEach(r => { r.bt = "back"; });
  if (v === "1-X2" && S.rows.length >= 2) {
    S.rows[1].bt = "lay"; S.rows[1].poly = false;
  } else if (v === "1X-2" && S.rows.length >= 2) {
    S.rows[0].bt = "lay"; S.rows[0].poly = false;
  }
}

function toggleSide(r) {
  r.bt = r.bt === "back" ? "lay" : "back";
  if (r.bt === "lay") r.poly = false;
}

function toggleLock(r) {
  if (r.fixed) {
    r.fixed = false; r.fixedVal = "";
    return;
  }
  // Read the current solved stake before the locks change
  const md = model();
  const idx = S.rows.indexOf(r);
  const cur = md.ok ? toDisp(md.x[idx], r.cur) : null;
  const value = r.manual !== null && r.manual.trim() !== "" ? r.manual
              : cur !== null ? cur.toFixed(2) : "";
  S.rows.forEach(x => { x.fixed = false; x.fixedVal = ""; x.manual = null; });
  S.total = null; S.totalRaw = "";
  r.fixed = true; r.fixedVal = value;
}

function cycleCur(r) {
  const next = r.cur === "USD" ? "BRL" : "USD";
  if (r.fixed) r.fixedVal = convertStr(r.fixedVal, r.cur, next);
  if (r.manual !== null) r.manual = convertStr(r.manual, r.cur, next);
  r.cur = next;
}

function resetAll() {
  S.n = 2; S.fork = "1-2"; S.showComm = false;
  S.rows = [mk(1), mk(2)]; S.nextId = 3;
  S.total = null; S.totalRaw = "";
  S.customRate = null; S.rateRaw = "";
}

function shareOdds(btn) {
  const p = new URLSearchParams();
  p.set("n", S.n);
  p.set("ft", S.fork);
  if (S.customRate !== null) p.set("rate", S.rateRaw);
  if (S.total !== null) p.set("t", S.totalRaw);
  S.rows.forEach((r, i) => {
    p.set(`o${i}`, r.odds);
    p.set(`c${i}`, r.comm);
    p.set(`bt${i}`, r.bt);
    p.set(`poly${i}`, r.poly ? "1" : "0");
    p.set(`cat${i}`, r.cat);
    p.set(`cur${i}`, r.cur);
    p.set(`fx${i}`, r.fixed ? "1" : "0");
    if (r.fixed) p.set(`fxs${i}`, r.fixedVal);
  });
  const url = `${location.origin}${location.pathname}?${p}`;
  const flash = t => { const o = btn.textContent; btn.textContent = t; setTimeout(() => btn.textContent = o, 1800); };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => flash("Link copied"), () => prompt("Copy this link:", url));
  } else {
    prompt("Copy this link:", url);
  }
}

function loadFromURL() {
  const p = new URLSearchParams(location.search);
  if (!p.has("n")) return;
  const n = Math.min(6, Math.max(2, parseInt(p.get("n"), 10) || 2));
  S.n = n;
  const ft = p.get("ft");
  S.fork = forksFor(n).some(f => f.id === ft) ? ft : forksFor(n)[0].id;
  S.rows = Array.from({ length: n }, (_, i) => {
    const r = mk(i + 1, clean(p.get(`o${i}`)));
    r.comm = clean(p.get(`c${i}`)) || "0";
    r.bt   = p.get(`bt${i}`) === "lay" ? "lay" : "back";
    r.poly = p.get(`poly${i}`) === "1";
    r.cat  = CATS.includes(p.get(`cat${i}`)) ? p.get(`cat${i}`) : "Sports";
    r.cur  = p.get(`cur${i}`) === "BRL" ? "BRL" : "USD";
    r.fixed = p.get(`fx${i}`) === "1";
    r.fixedVal = r.fixed ? clean(p.get(`fxs${i}`)) : "";
    return r;
  });
  S.nextId = n + 1;
  if (p.has("rate")) {
    S.rateRaw = clean(p.get("rate"));
    const v = num(S.rateRaw);
    S.customRate = v > 0 ? v : null;
  }
  if (p.has("t")) {
    S.totalRaw = clean(p.get("t"));
    const v = num(S.totalRaw);
    S.total = v > 0 ? v : null;
  }
}

// ═══════════════════════════════════════════════════════
//  LIVE BRL RATE  (USD base)
// ═══════════════════════════════════════════════════════
async function loadRates() {
  const sources = [
    { name: "open.er-api.com", url: "https://open.er-api.com/v6/latest/USD",                  pick: d => d?.rates?.BRL },
    { name: "Frankfurter (ECB)", url: "https://api.frankfurter.dev/v1/latest?base=USD&symbols=BRL", pick: d => d?.rates?.BRL },
  ];
  for (const s of sources) {
    try {
      const res = await fetch(s.url, { cache: "no-store" });
      if (!res.ok) continue;
      const v = s.pick(await res.json());
      if (v > 0) { S.liveRate = v; S.liveSrc = s.name; render(); return; }
    } catch (_) { /* try the next source */ }
  }
  S.liveSrc = "unavailable";
  render();
}

// ═══════════════════════════════════════════════════════
//  EVENTS  (delegated, no inline handlers)
// ═══════════════════════════════════════════════════════
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const row = el.dataset.id !== undefined ? S.rows.find(r => r.id === Number(el.dataset.id)) : null;

  switch (act) {
    case "n":         setOutcomes(Number(el.dataset.n)); break;
    case "comm":      S.showComm = !S.showComm; break;
    case "side":      if (row) toggleSide(row); break;
    case "fix":       if (row) toggleLock(row); break;
    case "cur":       if (row) cycleCur(row); break;
    case "rate-live": S.customRate = null; S.rateRaw = ""; break;
    case "reset":     resetAll(); break;
    case "theme": {
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("surebet-theme", next); } catch (_) {}
      break;
    }
    case "share":     shareOdds(el); return;
    default: return;
  }
  render();
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fork") { onFork(t.value); render(); return; }
  if (!t.dataset || !t.dataset.act) return;
  const row = S.rows.find(r => r.id === Number(t.dataset.id));
  if (!row) return;
  if (t.dataset.act === "poly") row.poly = t.checked;
  if (t.dataset.act === "cat")  row.cat = t.value;
  render();
});

document.addEventListener("input", e => {
  const t = e.target;
  const kind = t.dataset ? t.dataset.in : undefined;
  if (!kind) return;

  const v = clean(t.value);
  if (v !== t.value) t.value = v;

  const row = t.dataset.id !== undefined ? S.rows.find(r => r.id === Number(t.dataset.id)) : null;
  switch (kind) {
    case "odds": if (row) row.odds = v; break;
    case "comm": if (row) row.comm = v; break;
    case "stake":
      if (!row) break;
      if (row.fixed) row.fixedVal = v;
      else row.manual = v.trim() === "" ? null : v;
      S.total = null; S.totalRaw = "";
      break;
    case "total": {
      S.totalRaw = v;
      const p = num(v);
      if (v.trim() === "") S.total = null;
      else if (p > 0) {
        S.total = p;
        S.rows.forEach(x => { x.fixed = false; x.fixedVal = ""; x.manual = null; });
      }
      break;
    }
    case "rate": {
      S.rateRaw = v;
      const p = num(v);
      S.customRate = (v.trim() === "" || !(p > 0)) ? null : p;
      break;
    }
  }
  render();
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
try {
  const t = localStorage.getItem("surebet-theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (_) {}

S.rows = [mk(1), mk(2)];
S.nextId = 3;
loadFromURL();
render();
loadRates();
setInterval(loadRates, 60000);
</script>
</body>
</html>
